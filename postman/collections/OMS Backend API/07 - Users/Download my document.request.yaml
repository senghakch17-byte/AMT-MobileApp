$kind: http-request
url: "{{gatewayUrl}}/user/me/documents/{{userDocumentId}}/download"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.collectionVariables.get('userDocumentId')) {
        throw new Error('userDocumentId is empty. Upload a document with file selected, or run List my documents first.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      pm.test('Is PDF', function () { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/pdf'); });
    language: text/javascript
order: 6000
