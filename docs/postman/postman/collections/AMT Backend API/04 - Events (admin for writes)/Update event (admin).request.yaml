$kind: http-request
url: "{{gatewayUrl}}/event/events/{{eventId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "published"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Expected 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
