$kind: http-request
url: "{{gatewayUrl}}/library/api/v1/books/{{bookId}}"
method: PATCH
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "copies": 3,
      "shelf_location": "TEST-02"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 21000
