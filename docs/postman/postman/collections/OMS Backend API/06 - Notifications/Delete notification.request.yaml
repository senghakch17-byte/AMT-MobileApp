$kind: http-request
url: "{{gatewayUrl}}/notification/api/v1/notifications/{{notificationId}}"
method: DELETE
scripts:
  - type: beforeRequest
    code: pm.test('notificationId exists', function () { pm.expect(pm.environment.get('notificationId') || '').to.match(/^[a-f\d]{24}$/i); });
    language: text/javascript
  - type: afterResponse
    code: pm.test('Expected 204', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 6000