# EC2-D: booking-service and user-service
services:
  booking-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/booking-service
    env_file: ./.env
    environment:
      MONGODB_URI: "${MONGO_URI}"
    ports: ["${EC2_D_IP}:8003:8003"]

  user-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/user-service
    env_file: ./.env
    environment:
      MONGODB_URI: "${MONGO_URI}"
    ports: ["${EC2_D_IP}:8004:8004"]
    volumes: [user_uploads:/backend/uploads]

volumes:
  user_uploads: