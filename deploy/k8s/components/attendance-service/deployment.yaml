apiVersion: apps/v1
kind: Deployment
metadata: { name: attendance-service, namespace: oms }
spec:
  replicas: 1
  selector: { matchLabels: { app: attendance-service } }
  template:
    metadata: { labels: { app: attendance-service } }
    spec:
      containers:
        - name: attendance-service
          image: oms-attendance-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8002 }]
          env: [{ name: PORT, value: "8002" }]
          envFrom: [{ configMapRef: { name: oms-config } }, { secretRef: { name: oms-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 8002 }, initialDelaySeconds: 5 }
