apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: oms
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: oms-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          env: [{ name: PORT, value: "4000" }]
          envFrom: [{ configMapRef: { name: oms-config } }, { secretRef: { name: oms-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 5 }
