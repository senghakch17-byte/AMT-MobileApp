apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: shared-logs
              mountPath: /shared-logs
        - name: log-reader
          image: busybox:1.36
          command: [sh, -c, "touch /shared-logs/access.log && tail -F /shared-logs/access.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /shared-logs
      volumes:
        - name: config
          configMap: { name: nginx-config }
        - name: shared-logs
          emptyDir: {}
