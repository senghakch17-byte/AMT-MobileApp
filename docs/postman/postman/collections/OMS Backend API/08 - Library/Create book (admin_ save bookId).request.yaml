$kind: http-request
url: "{{gatewayUrl}}/library/api/v1/books"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "title": "Postman API Testing",
      "author": "OMS Team",
      "isbn": "{{testIsbn}}",
      "category": "testing",
      "description": "Disposable catalog record created by Postman.",
      "published_year": 2025,
      "copies": 2,
      "shelf_location": "TEST-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { pm.environment.set('bookId', pm.response.json().id); }
    language: text/javascript
order: 18000
