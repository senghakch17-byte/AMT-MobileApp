# Copy to secret.yaml, replace every placeholder, and do not commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: oms-secrets
  namespace: oms
type: Opaque
stringData:
  MONGO_URI: mongodb+srv://<username>:<password>@<cluster>/<database>
  MONGODB_URI: mongodb+srv://<username>:<password>@<cluster>/<database>
  JWT_SECRET: replace-with-one-shared-jwt-secret
  INTERNAL_API_KEY: replace-with-one-shared-internal-api-key
