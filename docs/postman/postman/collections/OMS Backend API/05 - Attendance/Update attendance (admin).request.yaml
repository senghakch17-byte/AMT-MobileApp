$kind: http-request
url: "{{gatewayUrl}}/attendance/{{attendanceId}}"
method: PATCH
description: Admin correction emits `attendance.corrected` after successful database update.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "present"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.test('attendanceId exists', function () { pm.expect(pm.environment.get('attendanceId') || '').to.match(/^[a-f\d]{24}$/i); });
    language: text/javascript
  - type: afterResponse
    code: pm.test('Expected 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000