apiVersion: apps/v1
kind: Deployment
metadata: { name: booking-service, namespace: oms }
spec:
  replicas: 1
  selector: { matchLabels: { app: booking-service } }
  template:
    metadata: { labels: { app: booking-service } }
    spec:
      containers:
        - name: booking-service
          image: oms-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8003 }]
          envFrom: [{ configMapRef: { name: oms-config } }, { secretRef: { name: oms-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 8003 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: booking-service, namespace: oms }
spec: { selector: { app: booking-service }, ports: [{ port: 8003, targetPort: 8003 }] }
