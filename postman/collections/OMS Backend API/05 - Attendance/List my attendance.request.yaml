$kind: http-request
url: "{{gatewayUrl}}/attendance/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
        const attendanceId = pm.collectionVariables.get('attendanceId');
        pm.test('Latest attendance session exists', function () { pm.expect(pm.response.json().some((item) => item._id === attendanceId)).to.equal(true); });
      }
    language: text/javascript
order: 6000
