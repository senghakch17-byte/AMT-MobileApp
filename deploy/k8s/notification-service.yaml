apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: oms }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: oms-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8005 }]
          env: [{ name: PORT, value: "8005" }]
          envFrom: [{ configMapRef: { name: oms-config } }, { secretRef: { name: oms-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 8005 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: oms }
spec: { selector: { app: notification-service }, ports: [{ port: 8005, targetPort: 8005 }] }
