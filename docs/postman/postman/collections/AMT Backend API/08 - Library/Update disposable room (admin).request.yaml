$kind: http-request
url: "{{gatewayUrl}}/library/api/v1/rooms/{{disposableRoomId}}"
method: PATCH
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "description": "Updated by Postman integration collection.",
      "capacity": 25
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 7000
