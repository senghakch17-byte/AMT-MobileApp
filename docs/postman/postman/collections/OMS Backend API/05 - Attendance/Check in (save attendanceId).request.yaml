$kind: http-request
url: "{{gatewayUrl}}/attendance/check-in"
method: POST
scripts:
  - type: beforeRequest
    code: pm.environment.unset('attendanceId');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Expected 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const attendanceId = pm.response.json()._id;
        pm.test('Response contains attendance ID', function () { pm.expect(attendanceId).to.match(/^[a-f\d]{24}$/i); });
        if (/^[a-f\d]{24}$/i.test(attendanceId)) { pm.environment.set('attendanceId', attendanceId); }
      }
    language: text/javascript
order: 1000