$kind: http-request
url: "{{gatewayUrl}}/user/{{userUserId}}/documents?skip=0&limit=20"
method: GET
queryParams:
  skip: "0"
  limit: "20"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      const documents = pm.response.json();
      if (documents.length) {
        pm.collectionVariables.set('userUserId', documents[0].user_id);
        pm.collectionVariables.set('userDocumentId', documents[0].id);
      }
    language: text/javascript
order: 9000
