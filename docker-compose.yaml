# LOCAL: docker compose up --build
x-base: &base
  restart: unless-stopped

services:
  nginx:
    build: ./nginx
    container_name: nginx
    depends_on: [gateway1, gateway2]
    ports: ["80:80"]
    networks: [app-net]

  redis:
    <<: *base
    image: redis:alpine
    command: redis-server --save "" --appendonly no
    container_name: redis
    ports: ["6379:6379"]
    networks: [app-net]

  register:
    build: ./apps/registration-service
    container_name: registration-service
    env_file:
      - path: ./apps/registration-service/.env
        required: false
    environment: [PORT=5001]
    ports: ["5001:5001"]
    networks: [app-net]

  login:
    build: ./apps/login-service
    container_name: login-service
    env_file:
      - path: ./apps/login-service/.env
        required: false
    environment: [PORT=5002]
    ports: ["5002:5002"]
    networks: [app-net]

  request-service:
    <<: *base
    build: ./apps/request-service
    container_name: request-service
    env_file:
      - path: ./apps/request-service/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    ports: ["8000:8000"]
    depends_on: [redis, notification-service]
    networks: [app-net]

  announcement-service:
    <<: *base
    build: ./apps/announcement-service
    container_name: announcement-service
    env_file:
      - path: ./apps/announcement-service/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    ports: ["8001:8001"]
    volumes: [announcement_uploads:/backend/uploads]
    depends_on: [redis, notification-service]
    networks: [app-net]

  attendance-service:
    <<: *base
    build: ./apps/attendance-service
    container_name: attendance-service
    env_file:
      - path: ./apps/attendance-service/.env
        required: false
    environment:
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    ports: ["8002:8002"]
    depends_on: [notification-service]
    networks: [app-net]

  booking-service:
    <<: *base
    build: ./apps/booking-service
    container_name: booking-service
    env_file:
      - path: ./apps/booking-service/.env
        required: false
    ports: ["8003:8003"]
    networks: [app-net]

  user-service:
    <<: *base
    build: ./apps/user-service
    container_name: user-service
    env_file:
      - path: ./apps/user-service/.env
        required: false
    environment:
      REGISTRATION_SERVICE_URL: http://registration-service:5001
    ports: ["8004:8004"]
    volumes: [user_uploads:/backend/uploads]
    networks: [app-net]

  notification-service:
    <<: *base
    build: ./apps/notification-service
    container_name: notification-service
    env_file:
      - path: ./apps/notification-service/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["8005:8005"]
    depends_on: [redis]
    networks: [app-net]

  gateway1:
    <<: *base
    build: ./apps/api-gateway
    container_name: gateway1
    env_file:
      - path: ./apps/api-gateway/.env
        required: false
    environment:
      - PORT=4000
      - REGISTER_SERVICE_URL=http://registration-service:5001
      - LOGIN_SERVICE_URL=http://login-service:5002
      - REQUEST_SERVICE_URL=http://request-service:8000
      - ANNOUNCEMENT_SERVICE_URL=http://announcement-service:8001
      - ATTENDANCE_SERVICE_URL=http://attendance-service:8002
      - BOOKING_SERVICE_URL=http://booking-service:8003
      - USER_SERVICE_URL=http://user-service:8004
      - NOTIFICATION_SERVICE_URL=http://notification-service:8005
      - REDIS_URL=redis://redis:6379
    depends_on: [register, login, request-service, announcement-service, attendance-service, booking-service, user-service, notification-service, redis]
    networks: [app-net]

  gateway2:
    <<: *base
    build: ./apps/api-gateway
    container_name: gateway2
    env_file:
      - path: ./apps/api-gateway/.env
        required: false
    environment:
      - PORT=4000
      - REGISTER_SERVICE_URL=http://registration-service:5001
      - LOGIN_SERVICE_URL=http://login-service:5002
      - REQUEST_SERVICE_URL=http://request-service:8000
      - ANNOUNCEMENT_SERVICE_URL=http://announcement-service:8001
      - ATTENDANCE_SERVICE_URL=http://attendance-service:8002
      - BOOKING_SERVICE_URL=http://booking-service:8003
      - USER_SERVICE_URL=http://user-service:8004
      - NOTIFICATION_SERVICE_URL=http://notification-service:8005
      - REDIS_URL=redis://redis:6379
    depends_on: [register, login, request-service, announcement-service, attendance-service, booking-service, user-service, notification-service, redis]
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  announcement_uploads:
  user_uploads:
