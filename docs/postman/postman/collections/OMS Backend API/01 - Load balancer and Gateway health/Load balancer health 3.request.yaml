$kind: http-request
description: "Runs infrastructure assertion; execute folder in order."
url: "{{gatewayUrl}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      pm.test('Gateway health body', function () { pm.expect(pm.response.json()).to.deep.equal({ status: 'ok' }); });
      pm.test('Response passed through Nginx', function () { pm.expect(pm.response.headers.get('Server')).to.include('nginx'); });
      const upstream = pm.response.headers.get('X-Gateway-Instance');
      pm.test('Nginx selected a Gateway instance', function () { pm.expect(upstream).to.be.a('string').and.not.empty; });
      const upstreams = JSON.parse(pm.environment.get('observedGatewayInstances') || '[]');
      if (!upstreams.includes(upstream)) { upstreams.push(upstream); }
      pm.environment.set('observedGatewayInstances', JSON.stringify(upstreams));
    language: text/javascript
order: 5000
