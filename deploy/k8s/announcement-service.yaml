apiVersion: apps/v1
kind: Deployment
metadata: { name: announcement-service, namespace: oms }
spec:
  replicas: 1
  selector: { matchLabels: { app: announcement-service } }
  template:
    metadata: { labels: { app: announcement-service } }
    spec:
      containers:
        - name: announcement-service
          image: oms-announcement-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8001 }]
          envFrom: [{ configMapRef: { name: oms-config } }, { secretRef: { name: oms-secrets } }]
          volumeMounts: [{ name: uploads, mountPath: /backend/uploads }]
          readinessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 5 }
      volumes: [{ name: uploads, persistentVolumeClaim: { claimName: announcement-uploads } }]
---
apiVersion: v1
kind: Service
metadata: { name: announcement-service, namespace: oms }
spec: { selector: { app: announcement-service }, ports: [{ port: 8001, targetPort: 8001 }] }
