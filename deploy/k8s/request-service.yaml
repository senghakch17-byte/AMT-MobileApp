apiVersion: apps/v1
kind: Deployment
metadata: { name: request-service, namespace: oms }
spec:
  replicas: 1
  selector: { matchLabels: { app: request-service } }
  template:
    metadata: { labels: { app: request-service } }
    spec:
      containers:
        - name: request-service
          image: oms-request-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: oms-config } }, { secretRef: { name: oms-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: request-service, namespace: oms }
spec: { selector: { app: request-service }, ports: [{ port: 8000, targetPort: 8000 }] }
