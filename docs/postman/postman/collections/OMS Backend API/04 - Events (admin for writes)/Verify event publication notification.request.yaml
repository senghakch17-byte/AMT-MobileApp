$kind: http-request
description: "Public proof for report: finds notification produced after draft-to-published event mutation. Redis consumer is asynchronous; run this request once more if it reports no match. Internal ingestion endpoint remains service-to-service only."
url: "{{gatewayUrl}}/notification/api/v1/notifications?type=event.published&skip=0&limit=20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      const notification = pm.response.json().find((item) => item.data && item.data.event_id === pm.environment.get('eventId'));
      pm.test('Published event notification exists', function () { pm.expect(notification, 'Run this request again after Redis consumer processes event.').to.exist; });
      if (notification) { pm.environment.set('notificationId', notification.id); }
    language: text/javascript
order: 3500