$kind: http-request
description: "Public proof for report: finds notification produced after draft-to-published event mutation. Collection Runner retries up to five times while Redis consumer processes event. Internal ingestion endpoint remains service-to-service only."
url: "{{gatewayUrl}}/notification/api/v1/notifications?type=event.published&skip=0&limit=20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      const notification = pm.response.json().find((item) => item.data && item.data.event_id === pm.environment.get('eventId'));
      if (notification) {
        pm.environment.set('notificationId', notification.id);
        pm.environment.unset('eventNotificationPolls');
      } else {
        const polls = Number(pm.environment.get('eventNotificationPolls') || '0') + 1;
        pm.environment.set('eventNotificationPolls', String(polls));
        if (pm.info.iteration !== undefined && polls < 5) { pm.execution.setNextRequest(pm.info.requestName); }
        else { pm.test('Published event notification exists', function () { pm.expect(notification, 'Redis consumer did not create event.published notification after five attempts.').to.exist; }); }
      }
    language: text/javascript
order: 3500