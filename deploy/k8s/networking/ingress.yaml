apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oms
  namespace: oms
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
spec:
  ingressClassName: nginx
  rules:
    - host: oms.aupp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
