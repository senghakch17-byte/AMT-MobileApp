# EC2-C: attendance-service, notification-service
services:
  attendance-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/attendance-service
    env_file: ../apps/attendance-service/.env
    environment:
      PORT: "8004"
      MEMBER_SERVICE_URL: http://${EC2_D_IP}:8002
    ports: ["8004:8004"]

  notification-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/notification-service
    env_file: ../apps/notification-service/.env
    environment: { PORT: "8005" }
    ports: ["8005:8005"]