$kind: http-request
description: "Public proof for report: finds notification produced by admin attendance correction. Collection Runner retries up to five times while Redis consumer processes event."
url: "{{gatewayUrl}}/notification/api/v1/notifications?type=attendance.corrected&skip=0&limit=20"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      pm.test('attendanceId exists', function () { pm.expect(pm.environment.get('attendanceId') || '').to.match(/^[a-f\d]{24}$/i); });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      const notification = pm.response.json().find((item) => item.data && item.data.attendance_id === pm.environment.get('attendanceId'));
      if (notification) {
        pm.environment.set('notificationId', notification.id);
        pm.environment.unset('attendanceNotificationPolls');
      } else {
        const polls = Number(pm.environment.get('attendanceNotificationPolls') || '0') + 1;
        pm.environment.set('attendanceNotificationPolls', String(polls));
        if (pm.info.iteration !== undefined && polls < 5) { pm.execution.setNextRequest(pm.info.requestName); }
        else { pm.test('Attendance correction notification exists', function () { pm.expect(notification, 'Redis consumer did not create attendance.corrected notification after five attempts.').to.exist; }); }
      }
    language: text/javascript
order: 5500