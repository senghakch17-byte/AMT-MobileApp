$kind: http-request
url: "{{gatewayUrl}}/library/api/v1/bookings"
method: POST
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "room_id": "{{roomId}}",
      "start_at": "{{bookingStart}}",
      "end_at": "{{bookingEnd}}",
      "attendees": 2,
      "purpose": "Postman booking to approve"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { pm.environment.set('bookingId', pm.response.json().id); }
    language: text/javascript
order: 9000
