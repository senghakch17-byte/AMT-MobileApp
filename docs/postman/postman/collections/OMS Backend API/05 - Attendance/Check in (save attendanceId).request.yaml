$kind: http-request
url: "{{gatewayUrl}}/attendance/check-in"
method: POST
scripts:
  - type: beforeRequest
    code: if (pm.environment.get('runAttendanceMutation') !== 'true') { pm.execution.skipRequest(); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Expected 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { pm.environment.set('attendanceId', pm.response.json()._id); }
    language: text/javascript
order: 1000