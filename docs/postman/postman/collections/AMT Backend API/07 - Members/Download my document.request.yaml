$kind: http-request
url: "{{gatewayUrl}}/members/api/v1/members/me/documents/{{memberDocumentId}}/download"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('memberDocumentId')) {
        throw new Error('memberDocumentId is empty. Upload a document with file selected, or run List my documents first.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      pm.test('Is PDF', function () { pm.expect(pm.response.headers.get('Content-Type')).to.include('application/pdf'); });
    language: text/javascript
order: 6000
