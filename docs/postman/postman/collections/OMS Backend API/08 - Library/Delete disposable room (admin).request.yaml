$kind: http-request
url: "{{gatewayUrl}}/library/api/v1/rooms/{{disposableRoomId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 204', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 8000
