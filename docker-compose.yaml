services:

  register:
    build: ./registration-service
    container_name: registration-service
    env_file: ./registration-service/.env
    environment:
      - PORT=5001
    ports:
      - "5001:5001"
    networks: [app-net]

  login:
    build: ./login-service
    container_name: login-service
    env_file: ./login-service/.env
    environment:
      - PORT=5002
    ports:
      - "5002:5002"
    networks: [app-net]

  request-service:
    build: ./request-service
    env_file: ./request-service/.env
    container_name: request-service
    ports:
      - "8000:8000"
    networks: [app-net]

  event-service:
    build: ./event-service
    env_file: ./event-service/.env
    container_name: event-service
    ports:
      - "8001:8001"
    volumes:
      - event_uploads:/backend/uploads
    networks: [app-net]

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file: ./api-gateway/.env
    environment:
      - PORT=4000
      - REGISTER_SERVICE_URL=http://registration-service:5001
      - LOGIN_SERVICE_URL=http://login-service:5002
      - REQUEST_SERVICE_URL=http://request-service:8000
      - EVENT_SERVICE_URL=http://event-service:8001
    ports:
      - "4000:4000"
    depends_on: [register, login, request-service, event-service]
    networks: [app-net]
  
networks:
  app-net:
    driver: bridge
volumes:
  event_uploads: