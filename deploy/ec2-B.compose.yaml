# EC2-B: request-service, event-service
x-env: &env
  REDIS_URL: redis://${EC2_A_IP}:6379

services:
  request-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/request-service
    env_file: ./.env
    environment: { <<: *env, PORT: "8000", MONGODB_URI: "${MONGO_URI}" }
    ports: ["${EC2_B_IP}:8000:8000"]

  event-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/event-service
    env_file: ./.env
    environment: { <<: *env, PORT: "8001", MONGODB_URI: "${MONGO_URI}" }
    ports: ["${EC2_B_IP}:8001:8001"]
    volumes: [event_uploads:/backend/uploads]

volumes:
  event_uploads: