$kind: http-request
url: "{{gatewayUrl}}/members/api/v1/members/{{memberUserId}}/documents?skip=0&limit=20"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected 200', function () { pm.response.to.have.status(200); });
      const documents = pm.response.json();
      if (documents.length) {
        pm.environment.set('memberUserId', documents[0].user_id);
        pm.environment.set('memberDocumentId', documents[0].id);
      }
    language: text/javascript
order: 9000
