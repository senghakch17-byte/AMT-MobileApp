$kind: http-request
url: "{{gatewayUrl}}/request/leave-requests/{{leaveRequestId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Updated reason for this leave request"
    }
scripts:
  - type: afterResponse
    code: pm.test('Expected 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
