$kind: collection
description: Nginx load-balancer and Gateway collection for OMS microservices. Every request runs. Run folder 01 to verify both Gateway replicas receive Nginx traffic, then register/login and run protected endpoints. Register user creates isolated user email for each run. Login requests store userToken or adminToken automatically.
variables:
  gatewayUrl: http://localhost
  gateway1Url: http://localhost:4000
  gateway2Url: http://localhost:4001
  observedUpstreams: '[]'
  userEmail: user@example.com
  userPassword: ChangeMe123!
  adminEmail: admin@example.com
  adminPassword: ChangeMeAdmin123!
  userToken: ""
  adminToken: ""
  leaveRequestId: ""
  eventId: ""
  attendanceId: ""
  notificationId: ""
  preScholarshipAcademicYear: 2026-2027
  memberUserId: ""
  memberDocumentId: ""
  roomId: ""
  disposableRoomId: ""
  bookingId: ""
  rejectedBookingId: ""
  cancelledBookingId: ""
  bookId: ""
  testRunId: ""
  bookingStart: ""
  bookingEnd: ""
  testIsbn: ""
auth:
  - id: a3ab0993-8967-4c9e-86f3-436507500e58
    type: bearer
    name: bearer auth
    credentials:
      token: "{{userToken}}"
