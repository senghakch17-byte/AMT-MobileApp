$kind: collection
description: Gateway collection for the AMT microservices. Set gatewayUrl, register/login, then run protected endpoints. Login requests store userToken or adminToken automatically.
variables:
  gatewayUrl: http://localhost:4000
  userEmail: user@example.com
  userPassword: ChangeMe123!
  adminEmail: admin@example.com
  adminPassword: ChangeMeAdmin123!
  userToken: ""
  adminToken: ""
  leaveRequestId: ""
  eventId: ""
  preScholarshipAcademicYear: 2026-2027
auth:
  - id: a3ab0993-8967-4c9e-86f3-436507500e58
    type: bearer
    name: bearer auth
    credentials:
      token: "{{userToken}}"
