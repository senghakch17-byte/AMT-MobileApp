$kind: http-request
url: "{{gatewayUrl}}/request/leave-requests"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "leave_type": "sick",
      "start_date": "2026-11-02",
      "end_date": "2026-11-03",
      "reason": "Medical appointment and recovery time",
      "attachment_urls": []
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { pm.environment.set('leaveRequestId', pm.response.json().id); }
    language: text/javascript
order: 2000
