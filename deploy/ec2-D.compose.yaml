# EC2-D: library-service and member-service
services:
  library-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/library-service
    env_file: ./.env
    environment:
      MONGODB_URI: "${MONGO_URI}"
    ports: ["${EC2_D_IP}:8003:8003"]

  member-service:
    extends: { file: common.yaml, service: base }
    build: ../apps/member-service
    env_file: ./.env
    environment:
      MONGODB_URI: "${MONGO_URI}"
    ports: ["${EC2_D_IP}:8004:8004"]
    volumes: [member_uploads:/backend/uploads]

volumes:
  member_uploads: