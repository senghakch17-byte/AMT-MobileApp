$kind: http-request
description: Public. Exact role `admin` creates admin; all other or missing role values create user. This request creates user; duplicate email returns 400.
url: "{{gatewayUrl}}/register/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Example User",
      "emailid": "{{userEmail}}",
      "pass": "{{userPassword}}",
      "mobile": "+85512345678",
      "role": "user"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Registration creates user', function () { pm.expect(pm.response.code).to.eql(201); pm.expect(pm.response.json().user.role).to.eql('user'); });
    language: text/javascript
order: 1000
